<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Палитры и блоки</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #fff;
      background: #264653;
      transition: background 0.4s;
    }

    main { text-align: center; padding: 24px; }
    h1 { margin: 0 0 20px; font-weight: 600; }

    .palettes {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .palette {
      display: flex;
      padding: 0;
      border: 3px solid transparent;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      background: none;
    }
    .palette.active { border-color: #fff; }
    .palette span { width: 36px; height: 48px; }

    .blocks {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-top: 16px;
    }

    .block {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s, transform 0.15s;
    }
    .block:active { transform: scale(0.94); }
  </style>
</head>
<body>
  <main>
    <h1>Выберите палитру</h1>

    <div class="palettes">
      <button class="palette" aria-label="Палитра 1">
        <span style="background:#264653"></span>
        <span style="background:#2a9d8f"></span>
        <span style="background:#e9c46a"></span>
        <span style="background:#e76f51"></span>
      </button>
      <button class="palette" aria-label="Палитра 2">
        <span style="background:#3d2c5e"></span>
        <span style="background:#7b5ea7"></span>
        <span style="background:#f4a6c0"></span>
        <span style="background:#ffe1a8"></span>
      </button>
    </div>

    <p>Нажмите на квадрат, чтобы сменить его цвет.</p>

    <div class="blocks">
      <div class="block"></div>
      <div class="block"></div>
      <div class="block"></div>
      <div class="block"></div>
    </div>
  </main>

  <script>
    
    const palettes = [
      { bg: '#264653', colors: ['#2a9d8f', '#e9c46a', '#e76f51', '#f4f1de'] },
      { bg: '#3d2c5e', colors: ['#7b5ea7', '#f4a6c0', '#ffe1a8', '#a8e6cf'] }
    ];

    let current = 0;
    const paletteButtons = document.querySelectorAll('.palette');
    const blocks = document.querySelectorAll('.block');
    const blockIndex = [...blocks].map((_, i) => i);

    function paintBlock(i) {
      const c = palettes[current].colors;
      blocks[i].style.background = c[blockIndex[i] % c.length];
    }

    function applyPalette(n) {
      current = n;
      document.body.style.background = palettes[n].bg;
      paletteButtons.forEach((b, i) => b.classList.toggle('active', i === n));
      blocks.forEach((_, i) => paintBlock(i));
    }

    
    paletteButtons.forEach((btn, n) => btn.addEventListener('click', () => applyPalette(n)));

    
    blocks.forEach((block, i) => block.addEventListener('click', () => {
      blockIndex[i]++;
      paintBlock(i);
    }));

    applyPalette(0);
  </script>
</body>
</html>
